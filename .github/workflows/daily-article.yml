name: Daily articles

on:
  # 読者の中心は北米。北米の朝(東部 5:00〜7:00ごろ)に記事が並ぶよう、日本時間 18:00 に走らせる
  # (2026-11-18 本人と決定。それまでは 06:30 JST)。
  # 本命は本人の PC の予定タスク「GT英語版_記事づくり」(cockpit\gt_en_daily_trigger.py)が 18:00 に
  # workflow_dispatch で起こす方。GitHub の定時実行は8〜9時間遅れて夜中に動いたため(11/20・11/21)、
  # 下の schedule は予備にして、日本時間 17:00〜23:59 に届いたときだけ書く(gate)。
  schedule:
    - cron: "30 9 * * *"   # 18:30 JST(予備)
  workflow_dispatch:
    inputs:
      url:
        description: "記事にしたい製品の URL(空なら候補から3本。複数はカンマ区切り)"
        required: false
        default: ""

concurrency:
  group: content-push
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          h=$(TZ=Asia/Tokyo date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$h" -lt 17 ]; then
            echo "予定の実行が遅れて日本時間 ${h} 時に届いたので書かない(夜中に記事が出るのを防ぐ)"
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  write:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 日本語版のダイジェストと各国のニュースから候補を出す
        run: python3 scripts/candidates.py

      - name: Claude Code CLI を入れる
        # claude-code-action 内蔵のインストールが失敗を握りつぶす不具合があるため自前で入れる(日本語版と同じ)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: 記事を書く(1回目)
        id: write1
        uses: anthropics/claude-code-action@v1
        env:
          MANUAL_URL: ${{ github.event.inputs.url }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude の GitHub アプリはこのリポジトリに入れていないので、ワークフローの鍵を使う
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: |
            --max-turns 200
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash"
          prompt: |
            docs/daily-prompt.md を読み、その手順どおりに今日の記事を書いてください。
            commit と push はしないでください(このあとのステップがします)。

      - name: 点検を通る記事が3本あるか数える(1回目のあと)
        id: count1
        run: |
          ok=0
          for f in $(git ls-files --others --exclude-standard content/posts); do
            python3 scripts/check_posts.py "$f" >/dev/null && ok=$((ok+1))
          done
          echo "点検を通る新しい記事: $ok 本"
          if [ -z "${{ github.event.inputs.url }}" ] && [ "$ok" -lt 3 ]; then echo "need=true" >> "$GITHUB_OUTPUT"; else echo "need=false" >> "$GITHUB_OUTPUT"; fi

      - name: 記事を書く(2回目)
        id: write2
        if: steps.count1.outputs.need == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          MANUAL_URL: ${{ github.event.inputs.url }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude の GitHub アプリはこのリポジトリに入れていないので、ワークフローの鍵を使う
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: |
            --max-turns 200
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash"
          prompt: |
            docs/daily-prompt.md を読み、その手順どおりに今日の記事を書いてください。
            これは 2 回目です。前の回で3本に届きませんでした。content/posts/ にある今日の記事と data/tried.md を読み、
            data/tried.md に無い候補から、合わせて3本になるまで書き足してください。
            commit と push はしないでください(このあとのステップがします)。

      - name: 点検を通る記事が3本あるか数える(2回目のあと)
        id: count2
        if: steps.count1.outputs.need == 'true'
        run: |
          ok=0
          for f in $(git ls-files --others --exclude-standard content/posts); do
            python3 scripts/check_posts.py "$f" >/dev/null && ok=$((ok+1))
          done
          echo "点検を通る新しい記事: $ok 本"
          if [ -z "${{ github.event.inputs.url }}" ] && [ "$ok" -lt 3 ]; then echo "need=true" >> "$GITHUB_OUTPUT"; else echo "need=false" >> "$GITHUB_OUTPUT"; fi

      - name: 記事を書く(3回目)
        id: write3
        if: steps.count2.outputs.need == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          MANUAL_URL: ${{ github.event.inputs.url }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude の GitHub アプリはこのリポジトリに入れていないので、ワークフローの鍵を使う
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: |
            --max-turns 200
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash"
          prompt: |
            docs/daily-prompt.md を読み、その手順どおりに今日の記事を書いてください。
            これは 3 回目です。前の回で3本に届きませんでした。content/posts/ にある今日の記事と data/tried.md を読み、
            data/tried.md に無い候補から、合わせて3本になるまで書き足してください。
            commit と push はしないでください(このあとのステップがします)。

      - name: 点検を通った記事だけを公開する
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898388+github-actions[bot]@users.noreply.github.com"
          new=$(git ls-files --others --exclude-standard content/posts)
          [ -z "$new" ] && { echo "新しい記事なし"; exit 0; }
          for f in $new; do
            python3 scripts/check_posts.py --online "$f" || { echo "点検に通らないので外す: $f"; rm -f "$f"; }
          done
          python3 scripts/build.py
          git add content/posts
          git diff --cached --quiet && { echo "公開する記事なし"; exit 0; }
          n=$(git diff --cached --name-only | wc -l)
          git commit -m "Daily articles: $n new post(s)"
          git push
