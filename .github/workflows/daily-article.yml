name: Daily articles

on:
  # 読者の中心は北米。北米の朝(東部 5:00〜7:00ごろ)に記事が並ぶよう、日本時間の夕方に走らせる
  # (2026-11-18 本人と決定。それまでは 06:30 JST)。アジアのその日の発表がそろい、日本語版 GT の
  # 朝の収集も済んでいる時刻。GitHub の定時実行は遅れることがあるので、実際に出るのは 19:00〜21:00 JST ごろ。
  schedule:
    - cron: "0 9 * * *"   # 18:00 JST
  workflow_dispatch:
    inputs:
      url:
        description: "記事にしたい製品の URL(空なら候補から3本。複数はカンマ区切り)"
        required: false
        default: ""

concurrency:
  group: content-push
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 日本語版のダイジェストと各国のニュースから候補を出す
        run: python3 scripts/candidates.py

      - name: Claude Code CLI を入れる
        # claude-code-action 内蔵のインストールが失敗を握りつぶす不具合があるため自前で入れる(日本語版と同じ)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - uses: anthropics/claude-code-action@v1
        env:
          MANUAL_URL: ${{ github.event.inputs.url }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude の GitHub アプリはこのリポジトリに入れていないので、ワークフローの鍵を使う
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          claude_args: |
            --max-turns 200
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep,Bash"
          prompt: |
            docs/daily-prompt.md を読み、その手順どおりに今日の記事を書いてください。
            commit と push はしないでください(このあとのステップがします)。

      - name: 点検を通った記事だけを公開する
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898388+github-actions[bot]@users.noreply.github.com"
          new=$(git ls-files --others --exclude-standard content/posts)
          [ -z "$new" ] && { echo "新しい記事なし"; exit 0; }
          for f in $new; do
            python3 scripts/check_posts.py --online "$f" || { echo "点検に通らないので外す: $f"; rm -f "$f"; }
          done
          python3 scripts/build.py
          git add content/posts
          git diff --cached --quiet && { echo "公開する記事なし"; exit 0; }
          n=$(git diff --cached --name-only | wc -l)
          git commit -m "Daily articles: $n new post(s)"
          git push
